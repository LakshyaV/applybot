[project]
name = "applybot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Lakshya Vasudeva", email = "lvasudev@uwaterloo.ca" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
applybot = "applybot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
